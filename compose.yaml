services:
  app:
    build: .
    env_file:
      - .env
    environment:
      - DB_PATH=/data/dashboard.db
    volumes:
      - dashboard-data:/data
    ports:
      - "127.0.0.1:${PORT:?PORT must be set in .env}:${PORT:?PORT must be set in .env}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT}/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  dashboard-data:
